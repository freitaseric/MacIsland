name: Build

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version

      - name: Keep the project compatible with the runner's Xcode
        run: sed -i '' 's/objectVersion = 110;/objectVersion = 77;/' MacIsland.xcodeproj/project.pbxproj

      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project MacIsland.xcodeproj \
            -scheme MacIsland \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build
